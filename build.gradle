plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

base {
    archivesName = 'storagedrawers-visual-tweaks'
}

version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
    maven { url = uri("https://repo.spongepowered.org/repository/maven-public/") }
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                storagedrawersvt {
                    source sourceSets.main
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, 'storagedrawersvt.refmap.json'
    config 'storagedrawersvt.mixins.json'
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'

    // Mixin (runtime is bundled with Forge)
    compileOnly 'org.spongepowered:mixin:0.8.5'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // StorageDrawers (published jar is SRG-mapped; fg.deobf makes it Mojmap for compile)
    implementation fg.deobf(files('libs/storagedrawers-forge-1.20.1-12.11.4.jar'))
}

tasks.named('jar') {
    manifest {
        attributes 'MixinConfigs': 'storagedrawersvt.mixins.json'
    }
}
